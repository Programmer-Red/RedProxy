services:
  redproxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: redproxy:local
    container_name: redproxy
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      DATA_DIR: /app/data
      CRX_PRIVATE_KEY_PATH: /app/data/redproxy.pem
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-90}
      MAX_CONCURRENT_DEVICES: ${MAX_CONCURRENT_DEVICES:-2}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-43200}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-300}
      CRX_KEY_BITS: ${CRX_KEY_BITS:-2048}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-true}
    volumes:
      - redproxy-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  redproxy-data:
