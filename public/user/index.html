<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RedProxy</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="logo">R</span>
          <div>
            <h1>RedProxy</h1>
            <p>一次性浏览器代理扩展</p>
          </div>
        </div>
        <button id="logout-button" class="btn ghost hidden" type="button">退出登录</button>
      </header>

      <section id="login-view" class="card login-card">
        <h2>登录</h2>
        <p class="hint" id="login-hint">请输入凭据以继续。</p>
        <form id="login-form">
          <div id="username-field" class="field hidden">
            <label for="username">用户名</label>
            <input id="username" name="username" autocomplete="username" maxlength="128" />
          </div>
          <div id="password-field" class="field hidden">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="512" />
          </div>
          <div id="totp-field" class="field hidden">
            <label for="totp-token">动态验证码</label>
            <input id="totp-token" name="token" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" autocomplete="one-time-code" />
          </div>
          <button type="submit" class="btn primary full">登录</button>
        </form>
        <p id="login-error" class="alert hidden" role="alert"></p>
      </section>

      <main id="main-view" class="hidden">
        <section class="card">
          <div class="card-head">
            <h2>临时会话</h2>
            <span id="session-status" class="badge">无会话</span>
          </div>

          <div class="cols">
            <div class="col">
              <div class="field">
                <label for="node-select">代理节点</label>
                <select id="node-select"></select>
              </div>
              <div class="field">
                <label for="ttl-select">有效期</label>
                <select id="ttl-select"></select>
              </div>

              <div class="actions">
                <button id="generate-crx" type="button" class="btn primary">生成临时 CRX</button>
                <button id="download-zip" type="button" class="btn">下载 ZIP</button>
                <button id="close-session" type="button" class="btn danger" disabled>关闭会话</button>
              </div>

              <div id="session-message" class="note"></div>
            </div>

            <div class="col">
              <h3>安装步骤</h3>
              <ol class="steps">
                <li>选择节点和有效期，生成临时 CRX。</li>
                <li>打开 <code>chrome://extensions</code>，启用开发者模式后安装 CRX。</li>
                <li>若浏览器禁止本地 CRX，请下载 ZIP 解压后“加载已解压的扩展程序”。</li>
                <li>扩展每 15 秒心跳一次；关闭页面 / 主动关闭 / 超时后会自动恢复代理并卸载。</li>
              </ol>
              <p class="hint">
                扩展中的授权是一次性的：首次心跳后立即轮换，旧 token 永久失效。
              </p>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
