name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            out: redproxy-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            out: redproxy-linux-arm64
          - os: macos-14
            target: bun-darwin-arm64
            out: redproxy-darwin-arm64
          - os: macos-13
            target: bun-darwin-x64
            out: redproxy-darwin-x64
          - os: windows-latest
            target: bun-windows-x64
            out: redproxy-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: bun build --compile --minify --target=${{ matrix.target }} --outfile ${{ matrix.out }} server/src/index.ts
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.out }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/programmer-red/redproxy:latest
            ghcr.io/programmer-red/redproxy:${{ github.ref_name }}
